# TestPulse local environment.
#   docker compose up --build          core system
#   docker compose --profile tools up  also starts Kafka UI on http://localhost:8090
# Credentials below are for local development only.

name: testpulse

x-service-defaults: &service-defaults
  build: &service-build
    context: .
    dockerfile: services/Dockerfile
  restart: unless-stopped

# Readiness of a Spring Boot service; SERVICE_PORT is set per service ($$ escapes compose interpolation).
x-service-healthcheck: &service-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVICE_PORT}/actuator/health/readiness || exit 1"]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 20s

services:

  # ---------- Infrastructure ----------

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "9092:9092"   # for tools and services running on the host
    environment:
      # KRaft: this single node is both broker and controller, no ZooKeeper.
      CLUSTER_ID: 6wCOtb2TTUaTZfRfUVaC7Q   # base64 UUID, fixed so the data volume stays valid
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: containers use kafka:19092, the host uses localhost:9092.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # A single broker cannot replicate; internal topics must use replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the services, never by a typo in a topic name.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:18.7
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      INGESTION_DB_PASSWORD: ingestion
      ANALYSIS_DB_PASSWORD: analysis
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.1
    profiles: [tools]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: testpulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------- TestPulse services ----------

  ingestion-service:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        MODULE: ingestion-service
    ports:
      - "8081:8081"
    healthcheck: *service-healthcheck
    environment:
      SERVICE_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ingestion
      SPRING_DATASOURCE_USERNAME: ingestion
      SPRING_DATASOURCE_PASSWORD: ingestion
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  analysis-service:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        MODULE: analysis-service
    ports:
      - "8082:8082"
    healthcheck: *service-healthcheck
    environment:
      SERVICE_PORT: 8082
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  notification-service:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        MODULE: notification-service
    ports:
      - "8083:8083"
    healthcheck: *service-healthcheck
    environment:
      SERVICE_PORT: 8083
    depends_on:
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ---------- Demo data ----------

  # One-shot: uploads demo/runs once ingestion-service is ready. Safe to repeat, uploads are idempotent.
  seed:
    image: curlimages/curl:8.23.0
    entrypoint: ["/bin/sh", "/scripts/seed.sh"]
    environment:
      INGESTION_URL: http://ingestion-service:8081
      RUNS_DIR: /demo/runs
    volumes:
      - ./scripts:/scripts:ro
      - ./demo:/demo:ro
    depends_on:
      ingestion-service:
        condition: service_healthy
    restart: "no"

volumes:
  kafka-data:
  postgres-data:
