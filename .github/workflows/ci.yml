name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, now irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and analyse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # One command runs the whole quality pipeline in lifecycle order:
      # Checkstyle -> compile -> unit tests + ArchUnit -> SpotBugs
      # -> integration tests with Testcontainers -> JaCoCo report.
      - name: Maven verify
        run: ./mvnw -B -ntp verify

      # Dogfooding: TestPulse will import these reports to analyse its own test history.
      # Uploaded even when the build fails, because failing runs are exactly what flaky detection needs.
      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          retention-days: 90
          if-no-files-found: warn

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: "**/target/site/jacoco/"
          retention-days: 14
          if-no-files-found: ignore

  dashboard:
    name: Dashboard (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci --no-audit --no-fund

      # Cheapest checks first: formatting, lint and types fail in seconds.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

      # Same dogfooding as the services: Vitest writes JUnit XML.
      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports-dashboard
          path: dashboard/reports/junit/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-dashboard
          path: dashboard/reports/coverage/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Docker image (${{ matrix.image }})
    needs: [build, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ingestion-service
            context: .
            file: services/Dockerfile
            build-args: MODULE=ingestion-service
          - image: analysis-service
            context: .
            file: services/Dockerfile
            build-args: MODULE=analysis-service
          - image: notification-service
            context: .
            file: services/Dockerfile
            build-args: MODULE=notification-service
          - image: dashboard
            context: dashboard
            file: dashboard/Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only; publishing images to a registry is out of MVP scope.
      - uses: docker/build-push-action@v7
        env:
          # Do not upload a build record artifact per image; it only clutters the run's artifacts.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          tags: testpulse/${{ matrix.image }}:ci
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

