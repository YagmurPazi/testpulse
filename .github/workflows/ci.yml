name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, now irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and analyse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # One command runs the whole quality pipeline in lifecycle order:
      # Checkstyle -> compile -> unit tests + ArchUnit -> SpotBugs
      # -> integration tests with Testcontainers -> JaCoCo report.
      - name: Maven verify
        run: ./mvnw -B -ntp verify

      # Dogfooding: TestPulse will import these reports to analyse its own test history.
      # Uploaded even when the build fails, because failing runs are exactly what flaky detection needs.
      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          retention-days: 90
          if-no-files-found: warn

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: "**/target/site/jacoco/"
          retention-days: 14
          if-no-files-found: ignore

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # PIT changes the domain and application code (mutants) and runs the unit tests against each change.
      # A mutant no test notices is a gap in the tests; below mutation.threshold (90 %) the build fails.
      - name: PIT
        run: >-
          ./mvnw -B -ntp -Djacoco.skip=true
          -pl services/ingestion-service,services/analysis-service,services/notification-service -am
          test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload mutation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: "**/target/pit-reports/"
          retention-days: 14
          if-no-files-found: ignore

  dashboard:
    name: Dashboard (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci --no-audit --no-fund

      # Cheapest checks first: formatting, lint and types fail in seconds.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

      # Same dogfooding as the services: Vitest writes JUnit XML.
      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports-dashboard
          path: dashboard/reports/junit/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-dashboard
          path: dashboard/reports/coverage/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Docker image (${{ matrix.image }})
    needs: [build, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ingestion-service
            context: .
            file: services/Dockerfile
            build-args: MODULE=ingestion-service
          - image: analysis-service
            context: .
            file: services/Dockerfile
            build-args: MODULE=analysis-service
          - image: notification-service
            context: .
            file: services/Dockerfile
            build-args: MODULE=notification-service
          - image: dashboard
            context: dashboard
            file: dashboard/Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only; publishing images to a registry is out of MVP scope.
      - uses: docker/build-push-action@v7
        env:
          # Do not upload a build record artifact per image; it only clutters the run's artifacts.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          tags: testpulse/${{ matrix.image }}:ci
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  e2e:
    name: End-to-end tests
    # Runs after the image builds, so every image below comes from their cache instead of being rebuilt.
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Loaded under the names compose.yaml uses, so the stack starts with --no-build.
      - name: Load ingestion-service image
        uses: docker/build-push-action@v7
        env: &no-build-record
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: services/Dockerfile
          build-args: MODULE=ingestion-service
          tags: testpulse/ingestion-service:local
          load: true
          cache-from: type=gha,scope=ingestion-service

      - name: Load analysis-service image
        uses: docker/build-push-action@v7
        env: *no-build-record
        with:
          context: .
          file: services/Dockerfile
          build-args: MODULE=analysis-service
          tags: testpulse/analysis-service:local
          load: true
          cache-from: type=gha,scope=analysis-service

      - name: Load notification-service image
        uses: docker/build-push-action@v7
        env: *no-build-record
        with:
          context: .
          file: services/Dockerfile
          build-args: MODULE=notification-service
          tags: testpulse/notification-service:local
          load: true
          cache-from: type=gha,scope=notification-service

      - name: Load dashboard image
        uses: docker/build-push-action@v7
        env: *no-build-record
        with:
          context: dashboard
          file: dashboard/Dockerfile
          tags: testpulse/dashboard:local
          load: true
          cache-from: type=gha,scope=dashboard

      # The services and what they depend on, without the one-shot seed container (which --wait would treat
      # as stopped): the tests upload their own runs.
      - name: Start the stack
        run: docker compose up --no-build --detach --wait --wait-timeout 300 dashboard notification-service

      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Playwright
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: dashboard
        run: npm run e2e

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            dashboard/reports/playwright/
            dashboard/test-results/
            compose-logs.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports-e2e
          path: dashboard/reports/e2e/
          retention-days: 90
          if-no-files-found: warn
